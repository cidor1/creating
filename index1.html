let currentQ = 0;
let score = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0,I:0,J:0};

// 页面切换
function startTest(){
    document.getElementById("page-home").classList.add("hidden");
    document.getElementById("page-question").classList.remove("hidden");
    showQuestion();
}
function showQuestion(){
    const q = questions[currentQ];
    document.getElementById("q-index").innerText = `第${currentQ+1}题 / 共32题`;
    const per = Math.round(((currentQ)/questions.length)*100);
    document.getElementById("q-progress").innerText = per+"%";
    document.getElementById("progress-bar").style.width = per+"%";
    document.getElementById("q-title").innerText = q.q;
    let optHtml = "";
    q.opts.forEach(opt=>{
        optHtml += `<div onclick="selectOption('${opt.tag}')" class="option-item p-4 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50">${opt.txt}</div>`
    })
    document.getElementById("option-box").innerHTML = optHtml;
}
function selectOption(tag){
    score[tag]++;
    currentQ++;
    if(currentQ >= questions.length){
        showResult();
    }else{
        showQuestion();
    }
}
function showResult(){
    document.getElementById("page-question").classList.add("hidden");
    document.getElementById("page-result").classList.remove("hidden");
    // 获取最高分标签
    let maxTag = "A";
    let maxVal = 0;
    for(let k in score){
        if(score[k]>maxVal){
            maxVal = score[k];
            maxTag = k;
        }
    }
    const res = resultData[maxTag];
    document.getElementById("result-title").innerText = res.title;
    document.getElementById("result-desc").innerText = res.desc;
}
function restart(){
    currentQ = 0;
    score = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0,I:0,J:0};
    document.getElementById("page-result").classList.add("hidden");
    document.getElementById("page-home").classList.remove("block");
    document.getElementById("page-home").classList.add("block");
}
</script>
